plugins {
    id 'java'
}

group = 'ru.mts'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = "14"
}

repositories {
    mavenCentral()
}

dependencies {
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.16.0'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.16.0'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-annotations', version: '2.16.0'
    implementation group: 'com.fasterxml.jackson.datatype', name: 'jackson-datatype-jsr310', version: '2.16.0'

    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-data-jpa', version: '2.7.4'
    implementation group: 'org.springframework', name: 'spring-jdbc', version: '5.3.23'
    implementation group: 'org.postgresql', name: 'postgresql', version: '42.7.3'
    implementation group: 'org.springframework.data', name: 'spring-data-jpa', version: '2.7.4'
    //implementation group: 'jakarta.persistence', name: 'jakarta.persistence-api', version: '3.2.0-M2'
    implementation group: 'org.hibernate.orm', name: 'hibernate-core', version: '6.4.4.Final'

    implementation 'org.springframework.boot:spring-boot-starter:2.7.4'
    implementation 'org.springframework.boot:spring-boot-autoconfigure:2.7.4'
    implementation 'org.projectlombok:lombok:1.18.28'

    testImplementation 'org.springframework.boot:spring-boot-starter-test:2.7.4'
    testImplementation 'junit:junit:4.13.1'

}
targetCompatibility = JavaVersion.VERSION_14
tasks.named('test') {
    useJUnitPlatform()
}