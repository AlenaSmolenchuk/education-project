plugins {
    id 'java'
}

group = 'ru.mts'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = "14"
}

repositories {
    mavenCentral()
}

dependencies {
    implementation("org.springframework.boot:spring-boot-starter-data-jdbc:2.5.0")
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:2.5.0'
    implementation 'org.springframework.boot:spring-boot-starter-web:2.5.0'
    implementation 'org.hibernate:hibernate-core:5.5.7.Final'
   // implementation 'org.flywaydb:flyway-core:8.5.0'
    annotationProcessor("org.projectlombok:lombok:1.18.20")
    compileOnly("org.projectlombok:lombok:1.18.20")

    implementation 'org.postgresql:postgresql:42.3.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:2.5.0'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers:2.5.0'
    testImplementation 'org.testcontainers:junit-jupiter:1.15.3'
    testImplementation 'org.testcontainers:postgresql:1.15.3'
    implementation 'org.springframework.boot:spring-boot-autoconfigure:2.7.4'

    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.16.0'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.16.0'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-annotations', version: '2.16.0'
    implementation group: 'com.fasterxml.jackson.datatype', name: 'jackson-datatype-jsr310', version: '2.16.0'


}
targetCompatibility = JavaVersion.VERSION_14
tasks.named('test') {
    useJUnitPlatform()
}